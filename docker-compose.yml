version: "3.0" # For docker compose viz

services:

  apache-httpd:
    build: ./apache-httpd/
    container_name: httpd
    depends_on:
      - matomo
      - ghc_web
    env_file:
      - .env     # path to your .env file
    volumes:   
      # - ./apache-httpd/httpd.conf:/usr/local/apache2/conf/httpd.conf
      - ./apache-httpd/httpd-ssl.conf:/usr/local/apache2/conf/httpd.conf
      - ./apache-httpd/robots.txt:/usr/local/apache2/htdocs/robots.txt      
      - /etc/cert/2logs.pem:/usr/local/apache2/conf/matomo/fullchain.pem  
      - /etc/cert/logs_privkey4.pem:/usr/local/apache2/conf/matomo/privkey.pem
      - /etc/cert/1ghc.pem:/usr/local/apache2/conf/health/fullchain.pem  
      - /etc/cert/ghc_privkey1.pem:/usr/local/apache2/conf/health/privkey.pem
      - ./apache-httpd/logs:/usr/local/apache2/logs
    ports:
      - "80:80"
      - "443:443"
    # networks:
    #   default:
    #     aliases:
    #       - ogcapi.dgterritorio.gov.pt
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    command: --max-allowed-packet=64MB
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MARIADB_AUTO_UPGRADE=1
      - MARIADB_DISABLE_UPGRADE_BACKUP=1
    env_file:
      - .env     # path to your .env file
    volumes:
      - ./matomo/data/maria:/var/lib/mysql:Z
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  matomo:
    build:
      context: ./matomo/
      dockerfile: Dockerfile.main
    container_name: matomo
    # ports:
    #   - 8081:80
    env_file:
      - .env     # path to your .env file
    # volumes:
    #   - ./matomo/data/matomo:/var/www/html:z
    #   - ./apache-httpd/logs:/apache
    networks:
      - default
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # python_matomo:
  #   build:
  #     context: ./matomo/
  #     dockerfile: Dockerfile.cron
  #   container_name: matomo_python
  #   env_file:
  #     - .env     # path to your .env file
  #   volumes:
  #       - ./matomo/data/matomo:/var/www/html:z
  #       - ./apache-httpd/logs:/apache
  #       - ./matomo/state:/state
  #   depends_on:
  #     - matomo
  #   restart: always
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  ghc_web:
    image: geopython/geohealthcheck:0.9.0
    container_name: ghc_web
    restart: on-failure
    expose:
       - 80
    # ports:
    #   - 8083:80
    env_file:
      - .env     # path to your .env file
    volumes:
      - ghc_sqlitedb:/GeoHealthCheck/DB
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ghc_runner:
    image: geopython/geohealthcheck:0.9.0
    container_name: ghc_runner
    restart: on-failure
    entrypoint:
      - /run-runner.sh
    env_file:
      - .env     # path to your .env file
    volumes:
      - ghc_sqlitedb:/GeoHealthCheck/DB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
volumes:
  ghc_sqlitedb:

networks:
  default: